    level: rule
    calculator: boolean
    params: {points: 15}
    sort: 317
    source_ref: "细则 P19 参军入伍考评学年基础分为 15 分"

  - id: labor_achievement
    parent: labor
    name: 成果性评价
    level: section
    cap: 10
    aggregation: sum
    sort: 32
    source_ref: "细则 P19 三（二）成果性评价（上限 10 分）"

  - id: labor_ach_social_work
    parent: labor_achievement
    name: 社会工作成果
    level: group
    cap: 10
    aggregation: sum
    sort: 321
    source_ref: "细则 P19-20 社会工作；考核合格基础 4 分，工作成效按表累加，同类荣誉取最高"

  - id: labor_ach_social_work_base
    parent: labor_ach_social_work
    name: 任职考核合格
    level: rule
    calculator: boolean
    params: {points: 4}
    sort: 3210
    source_ref: "细则 P19 学院、指导单位考核合格后可获得 4 分"

  - id: labor_ach_social_work_honor
    parent: labor_ach_social_work
    name: 工作成效荣誉
    level: group
    cap: 10
    aggregation: highest
    sort: 3211

  - id: labor_ach_social_work_collective
    parent: labor_ach_social_work_honor
    name: 集体荣誉
    level: rule
    calculator: matrix
    params:
      dimensions: [region, steps]
      table:
        national: {"0": 10, "1": 8.5, "2": 7, "3": 5.5, "4": 4, "5": 2.5}
        provincial: {"0": 8.5, "1": 7, "2": 5.5, "3": 4, "4": 2.5, "5": 1}
        city: {"0": 7, "1": 5.5, "2": 4, "3": 2.5, "4": 1, "5": 0}
        school: {"0": 5.5, "1": 4, "2": 2.5, "3": 1, "4": 0, "5": 0}
        college: {"0": 4, "1": 2.5, "2": 1, "3": 0, "4": 0, "5": 0}
      default: 0
    sort: 32111
    source_ref: "细则 P19-20 表格；steps=0 为主要负责人，其他干部每降一级减 1.5 分"

  - id: labor_ach_social_work_personal
    parent: labor_ach_social_work_honor
    name: 任职期间个人荣誉
    level: rule
    calculator: lookup
