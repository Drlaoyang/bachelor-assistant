      table:
        national: {leader: 10, second: 8.5, third: 7, fourth_plus: 5.5, individual: 10}
        provincial: {leader: 8.5, second: 7, third: 5.5, fourth_plus: 4, individual: 8.5}
        city: {leader: 7, second: 5.5, third: 4, fourth_plus: 2.5, individual: 7}
        school: {leader: 5.5, second: 4, third: 2.5, fourth_plus: 1, individual: 5.5}
        college: {leader: 4, second: 2.5, third: 1, fourth_plus: 0, individual: 4}
