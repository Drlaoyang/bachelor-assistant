version: "2026-2027"
name: "山东大学网络空间安全学院本科生素质能力评价"
description: "2026-2027 学年；目前沿用 2025-12-18 学院实施细则与 2025 创新素养补充通知。学校发布新文件后复制本版本再调整。"
total_cap: 100
sources:
  - title: "山东大学网络空间安全学院本科生综合评价实施细则（试行）（12.18）"
    file: "1.网络空间安全学院本科生综合评价实施细则（试行）（12.18）.pdf"
    note: "主规则；附件 2 为素质能力评价实施细则"
  - title: "关于《山东大学本科生综合评价办法（试行）》创新素养部分的补充通知（2025）"
    file: "附件1：关于《山东大学本科生综合评价办法（试行）》创新素养部分的补充通知（2025）.docx"
    note: "创新素养部分补充；与学院细则一致"

nodes:
  # ------------------------------------------------------------------
  # 根节点
  # ------------------------------------------------------------------
  - id: quality
    parent: null
    name: 素质能力
    level: root
    cap: 100
    aggregation: sum
    sort: 0

  # ------------------------------------------------------------------
  # 身心素养（15）= 基础性（9）+ 成果性（6）
  # ------------------------------------------------------------------
  - id: physical
    parent: quality
    name: 身心素养
    level: category
    cap: 15
    aggregation: sum
    sort: 10
    source_ref: "细则 P16 一、身心素养（上限 15 分）"

  - id: physical_base
    parent: physical
    name: 基础性评价
    level: section
    cap: 9
    aggregation: sum
    sort: 11
    source_ref: "细则 P16 一（一）基础性评价（上限 9 分）"

  - id: physical_base_sports
    parent: physical_base
    name: 体育/心理类活动参与
    level: group
    cap: 9
    aggregation: top_n
    max_count: 3
    sort: 111
    source_ref: "细则 P16 一（一）（1）每次计 3 分"

  - id: physical_base_sports_rule
    parent: physical_base_sports
    name: 单次体育/心理类活动
    level: rule
    calculator: per_occurrence
    params:
      points: 3
      proof_required: true
    sort: 1111

  - id: physical_base_fitness
    parent: physical_base
    name: 《国家学生体质健康标准》测试
    level: rule
    calculator: lookup
    params:
      field: grade
      table:
        优秀: 9
        良好: 6
        合格: 3
        不合格: 0
      default: 0
    sort: 112
    source_ref: "细则 P16 一（一）（2）"

  - id: physical_achievement
    parent: physical
    name: 成果性评价
    level: section
    cap: 6
    aggregation: highest
    sort: 12
    source_ref: "细则 P16-17 一（二）成果性评价（上限 6 分，不累计）"

  - id: physical_achievement_sports
    parent: physical_achievement
    name: 体育及心理类赛事获奖
    level: rule
    calculator: tiered_award
    params:
      table:
        national:
          individual: {first: 6, second: 5.25, third: 4.5, other: 3.75}
          collective: {first: 6, second: 5.25, third: 4.5, other: 3.75}
        provincial:
          individual: {first: 4.5, second: 3.75, third: 3, other: 2.25}
          collective: {first: 5.25, second: 4.5, third: 3.75, other: 3}
        city:
          individual: {first: 3.375, second: 2.625, third: 1.875, other: 1.3125}
          collective: {first: 4.125, second: 3.375, third: 2.625, other: 1.875}
        school:
          individual: {first: 2.25, second: 1.5, third: 0.75, other: 0.375}
          collective: {first: 3, second: 2.25, third: 1.5, other: 0.75}
        academy:
          individual: {first: 2.125, second: 1.375, third: 0.625, other: 0.25}
          collective: {first: 2.875, second: 2.125, third: 1.375, other: 0.625}
        college:
          individual: {first: 2.0, second: 1.25, third: 0.5, other: 0.125}
          collective: {first: 2.75, second: 2.0, third: 1.25, other: 0.5}
      rank_mapping:
        first: first
        second: second
        third: third
        other: other
      prize_mapping:
        first: first
        second: third
        third: other
      rank_number_mapping:
        - {max: 1, level: first}
        - {max: 2, level: second}
        - {max: 3, level: third}
        - {max: 8, level: other}
      rank_limit: 8
      modifiers:
        fun: 0.5
      default: 0
    sort: 121
    source_ref: "细则 P17 一（二）表格及注；市级/书院级/院级按注折算；趣味类减半"

  # ------------------------------------------------------------------
  # 文艺素养（15）= 基础性（9）+ 成果性（6）
  # ------------------------------------------------------------------
  - id: arts
    parent: quality
    name: 文艺素养
    level: category
    cap: 15
    aggregation: sum
    sort: 20
    source_ref: "细则 P17 二、文艺素养（上限 15 分）"

  - id: arts_base
    parent: arts
    name: 基础性评价
    level: section
    cap: 9
    aggregation: sum
    sort: 21
    source_ref: "细则 P17 二（一）基础性评价（上限 9 分）"

  - id: arts_base_activities
    parent: arts_base
    name: 美育类活动参与
    level: group
    cap: 9
    aggregation: top_n
    max_count: 3
    sort: 211
    source_ref: "细则 P17 二（一）每次计 3 分"

  - id: arts_base_activities_rule
    parent: arts_base_activities
    name: 单次美育类活动
    level: rule
    calculator: per_occurrence
    params:
      points: 3
      proof_required: true
    sort: 2111

  - id: arts_achievement
    parent: arts
    name: 成果性评价
    level: section
    cap: 6
    aggregation: highest
    sort: 22
    source_ref: "细则 P17 二（二）成果性评价（上限 6 分，不累计）"

  - id: arts_achievement_awards
    parent: arts_achievement
    name: 艺术展演/比赛获奖
    level: rule
    calculator: tiered_award
    params:
      table:
        national:
          individual: {first: 6, second: 5.25, third: 3.75, other: 3}
          collective: {first: 3.75, second: 3, third: 2.25, other: 1.5}
        provincial:
          individual: {first: 4.5, second: 3.75, third: 2.25, other: 1.5}
          collective: {first: 3, second: 2.25, third: 1.5, other: 0.75}
        city:
          individual: {first: 3.75, second: 3.0, third: 1.875, other: 1.125}
          collective: {first: 2.625, second: 1.875, third: 1.125, other: 0.5625}
        school:
          individual: {first: 3, second: 2.25, third: 1.5, other: 0.75}
          collective: {first: 2.25, second: 1.5, third: 0.75, other: 0.375}
        academy:
          individual: {first: 2.875, second: 2.125, third: 1.375, other: 0.625}
          collective: {first: 2.125, second: 1.375, third: 0.625, other: 0.25}
        college:
          individual: {first: 2.75, second: 2.0, third: 1.25, other: 0.5}
          collective: {first: 2.0, second: 1.25, third: 0.5, other: 0.125}
      rank_mapping:
        first: first
        second: second
        third: third
        other: other
      prize_mapping:
        first: first
        second: second
        third: third
        special: first
      rank_number_mapping:
        - {max: 1, level: first}
        - {max: 3, level: second}
        - {max: 6, level: third}
        - {max: 8, level: other}
      rank_limit: 8
      modifiers: {}
      default: 0
    sort: 221
    source_ref: "细则 P18 二（二）表格及注；名次与等级映射见注（3）"

  - id: arts_achievement_literature
    parent: arts_achievement
    name: 文学作品/新闻稿件
    level: rule
    calculator: literature
    params:
      platform_points:
        national: 5
        campus: 3
        school: 2
      staff_min_count: 5
    sort: 222
    source_ref: "细则 P18 文学作品注；供职平台/院学通社记者第 6 篇起计分"

  # ------------------------------------------------------------------
  # 劳动素养（25）= 基础性（15）+ 成果性（10）
  # ------------------------------------------------------------------
  - id: labor
    parent: quality
    name: 劳动素养
    level: category
    cap: 25
    aggregation: sum
    sort: 30
    source_ref: "细则 P18 三、劳动素养（上限 25 分）"

  - id: labor_base
    parent: labor
    name: 基础性评价
    level: section
    cap: 15
    aggregation: sum
    sort: 31
    source_ref: "细则 P18-19 三（一）基础性评价（上限 15 分）"

  - id: labor_base_social_work
    parent: labor_base
    name: 社会工作任职
    level: rule
    calculator: boolean
    params: {points: 5}
    sort: 311
    source_ref: "细则 P18 任职一学年及以上，基础分 5 分"

  - id: labor_base_practice
    parent: labor_base
    name: 社会实践考核合格
    level: rule
    calculator: boolean
    params: {points: 5}
    sort: 312
    source_ref: "细则 P19 寒暑假社会实践考核合格，基础分 5 分"

  - id: labor_base_volunteer
    parent: labor_base
    name: 志愿服务时长
    level: rule
    calculator: threshold
    params: {field: hours, op: gt, threshold: 20, points: 5}
    sort: 313
    source_ref: "细则 P19 学年志愿服务时长超过 20 小时，基础分 5 分"

  - id: labor_base_career
    parent: labor_base
    name: 生涯发展活动
    level: group
    cap: 5
    aggregation: top_n
    max_count: 5
    sort: 314
    source_ref: "细则 P19 每次 1 分，最高 5 分"

  - id: labor_base_career_rule
    parent: labor_base_career
    name: 单次生涯发展活动
